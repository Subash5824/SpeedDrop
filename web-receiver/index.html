<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpeedDrop | Fast & Secure File Sharing</title>
  <link rel="icon" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #9b5de5;
      --secondary: #00f5d4;
      --bg: #0a0a1a;
      --glass: rgba(255, 255, 255, 0.05);
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Initial Splash Loader */
    .splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      z-index: 1000;
      transition: opacity 0.5s ease-out;
    }

    .splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .logo-container {
      position: relative;
      width: 180px;
      height: 180px;
      margin-bottom: 2rem;
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 20px rgba(155, 93, 229, 0.4));
      animation: float 3s ease-in-out infinite;
    }

    .logo-glow {
      position: absolute;
      inset: -20px;
      background: radial-gradient(circle, rgba(155, 93, 229, 0.2) 0%, transparent 70%);
      animation: pulse-glow 2s ease-in-out infinite;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-15px);
      }
    }

    @keyframes pulse-glow {

      0%,
      100% {
        opacity: 0.5;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.1);
      }
    }

    .splash h1 {
      font-size: 3rem;
      font-weight: 700;
      margin: 0;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
    }

    .loader-bar {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      margin-top: 1.5rem;
      overflow: hidden;
    }

    .loader-progress {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 10px;
      animation: slide 1.5s infinite ease-in-out;
    }

    @keyframes slide {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(250%);
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <!-- Initial loading state while React mounts -->
    <div class="splash" id="initial-splash">
      <div class="logo-container">
        <div class="logo-glow"></div>
        <img src="logo.png" alt="SpeedDrop" class="logo-img" />
      </div>
      <h1>SpeedDrop</h1>
      <div class="loader-bar">
        <div class="loader-progress"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Remove splash when React is ready (roughly)
    window.addEventListener('load', () => {
      setTimeout(() => {
        const splash = document.getElementById('initial-splash');
        if (splash) splash.classList.add('fade-out');
      }, 800);
    });
  </script>
</body>

</html>
